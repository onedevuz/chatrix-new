server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # редирект каталога без слэша (/blog -> /blog/) должен быть относительным,
    # иначе за Cloudflare уходит Location: http://... и получается цепочка https->http->https
    absolute_redirect off;

    # www → apex (дубль контента для поисковиков)
    if ($host = www.prochat.uz) {
        return 301 https://prochat.uz$request_uri;
    }

    # /index.html и /blog/index.html → чистый URL каталога
    if ($request_uri ~ ^(.*/)index\.html$) {
        return 301 https://$host$1;
    }

    # остальные /*.html → чистый URL без расширения
    if ($request_uri ~ ^/(.+)\.html$) {
        return 301 https://$host/$1;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
